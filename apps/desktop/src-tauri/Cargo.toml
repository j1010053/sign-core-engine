[package]
name = "langcraft-desktop"
version = "0.1.0"
description = "LangCraft desktop workbench"
edition = "2021"

[features]
default = []
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[lib]
name = "langcraft_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "langcraft-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
conlang-app = { path = "../../../crates/app" }
conlang-changeset = { path = "../../../crates/changeset" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
