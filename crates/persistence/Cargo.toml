[package]
name = "conlang-persistence"
version = "0.1.0"
edition = "2021"
description = "Host filesystem persistence for P60/P64 evolution graphs"

[dependencies]
conlang-changeset = { path = "../changeset" }
conlang-language = { path = "../language" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
