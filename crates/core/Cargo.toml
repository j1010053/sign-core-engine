[package]
name = "conlang-core"
version = "0.1.0"
edition = "2021"
description = "Autosegmental sound-change engine core (repr + primitives + lifecycle, M0 steps 1-2)"

[dependencies]
# M0 §6 crate 清單。核心保持 WASM-safe:無 fs、無執行緒、無 panic。
smallvec = "1"   # Autoseg::links 幾乎 0–2 條(NOTE(I3) 替換 Vec)
thiserror = "2"  # 錯誤型別;診斷仍走回傳資料,非列印

[dev-dependencies]
proptest = "1"   # 六原語不變量(性質測試)
insta = "1"      # 每 commit 一快照(執行語意 §4 對齊)
