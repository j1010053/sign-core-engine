[package]
name = "conlang-language"
version = "0.1.0"
edition = "2021"
description = "Language: the synchronic knowledge file (Global/Trait/Sign) with canonical printer (2.0 step 8)"

[dependencies]
# P20 依賴方向:language → dsl(→ core);禁反向。
# core 直依賴僅為 Word 型別存取(裁決 2 接口 language::build_word → dsl::Word;
# dsl 未 re-export Word,I18)。
tshiatun-dsl = { path = "../../tshiatun/crates/dsl" }
tshiatun-core = { path = "../../tshiatun/crates/core" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
rand_chacha = { version = "0.3", default-features = false }
rand_core = "0.6"

[dev-dependencies]
insta = "1"
