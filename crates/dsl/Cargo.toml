[package]
name = "conlang-dsl"
version = "0.1.0"
edition = "2021"
description = "Tier sound-change DSL front-end: logos lexer + chumsky parser + lowering + executor (M0 step 4)"

[dependencies]
conlang-core = { path = "../core" }
logos = "0.14"                 # I6:lexer
chumsky = "0.9"                # I6:parser(錯誤恢復)
unicode-normalization = "0.1"  # I6:入口 NFC 正規化
thiserror = "2"

[dev-dependencies]
insta = "1"
